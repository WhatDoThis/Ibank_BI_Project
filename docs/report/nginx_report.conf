# =============================================================================
# Nginx 설정: Report 대시보드 (기존 3500/8500 포트 재사용)
# 기존 ACC BI Assistant 등 3500·8500 에서 동작하던 서비스를 종료한 뒤,
# 우리 시스템(Report 대시보드)을 해당 포트에서 실행하고 아래 location 으로 프록시.
#
# [서버 실행] Env/config/config.json: backend.api_port=8500, frontend.static_port=3500, api_base_url="/report_api"
#   report-api.service:  ExecStart=.../python run.py back   → 8500
#   report-front.service: ExecStart=.../python run.py serve  → 3500 (빌드 없이 즉시 응답, 502 방지)
# [배포 후] git pull → cd Frontend/react-app && npm run build → systemctl restart report-front
#
# [502 발생 시] nginx는 3500/8500 에 연결만 시도함. 502 = upstream(3500) 미응답.
#   → 서버에서: Env/config/config.json 의 frontend.static_port 가 3500 인지 확인
#   → 서버에서: systemctl status report-front (active?), ss -tlnp | grep 3500 (리스닝?)
#   → 서버에서: tail -20 /var/log/nginx/error.log (connection refused 등 원인 확인)
# =============================================================================

# [프론트엔드] /report -> Report 대시보드 (3500 포트)
    location /report/ {
        allow 127.0.0.1;
        allow 39.115.174.0/24;
        allow 49.247.47.206;
        deny all;

        proxy_pass http://127.0.0.1:3500/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    location = /report {
        allow 127.0.0.1;
        allow 39.115.174.0/24;
        allow 49.247.47.206;
        deny all;
        return 302 /report/;
    }

# [백엔드] /report_api -> Report 대시보드 API (8500 포트)
    location /report_api/ {
        allow 127.0.0.1;
        allow 39.115.174.0/24;
        allow 49.247.47.206;
        deny all;

        proxy_pass http://127.0.0.1:8500/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
